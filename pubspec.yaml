name: pdfhelper
description: "DocHelper: read, edit, create, convert and share documents of every common kind on the phone."
publish_to: 'none'

version: 3.0.0+3

environment:
  sdk: ">=3.10.4 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # The ONLY PDF dependency. From-scratch Rust core over dart:ffi, vendored
  # as a git submodule under packages/. Owns parsing, merge, split, reorder,
  # rotate, metadata, encryption, text extraction, page rendering,
  # image-to-PDF composition and AI chunk export.
  # Run ./scripts/build_libs.sh --only pdf once to produce the native binaries.
  flutter_pdf_core:
    path: packages/flutter_pdf_core

  # DocHelper's other engines: one library per kind of file, each written
  # from scratch in Rust and called over dart:ffi (see PLAN.md). Build their
  # native binaries with ./scripts/build_libs.sh.
  flutter_text_core:
    path: packages/flutter_text_core
  flutter_sheet_core:
    path: packages/flutter_sheet_core
  flutter_slide_core:
    path: packages/flutter_slide_core
  flutter_word_core:
    path: packages/flutter_word_core
  flutter_archive_core:
    path: packages/flutter_archive_core

  # File handling
  file_picker: ^13.1.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  open_file: ^4.0.0
  
  # Camera
  camera: ^0.12.1
  
  # Image processing (camera filters + JPEG transcoding; not a PDF library)
  image: ^4.12.0
  crop_your_image: ^2.0.1
  
  # Permissions
  permission_handler: ^13.0.2
  
  # Share files
  share_plus: ^13.3.1
  
  # Settings persistence
  shared_preferences: ^2.5.6
  
  # State management
  provider: ^6.1.5+1
  
  # Notifications
  flutter_local_notifications: ^22.3.2

  # Receive intents (e.g. open PDF from file manager)
  receive_intent: ^0.2.8

  # Open external URLs (Rate App, Privacy Policy, Terms of Service)
  url_launcher: ^6.3.3

  # Read version/build number from pubspec.yaml at runtime
  package_info_plus: ^10.2.2

  # Firebase + Crashlytics (requires google-services.json / GoogleService-Info.plist)
  firebase_core: ^5.0.0
  firebase_crashlytics: ^6.0.0

  # AdMob (using Google's official test IDs in development)
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Lets tests point path_provider at a temp directory, so the Files library
  # sweep can be exercised against a real directory tree.
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/icons/app_icon.png
