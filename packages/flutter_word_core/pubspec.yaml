name: flutter_word_core
description: "DocHelper's word-processing engine: DOCX, ODT and RTF documents read, edited in place and written back, built from scratch in Rust."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.10.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# An FFI plugin: the Rust library is prebuilt by scripts/build_engines.sh
# (in the app repository) into android/src/main/jniLibs and macos/Frameworks.
flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      macos:
        ffiPlugin: true
