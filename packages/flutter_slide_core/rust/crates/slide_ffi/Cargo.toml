[package]
name = "slide_ffi"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "The Rust FFI layer of the slide-processing engine, for dart:ffi."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
slide_core = { path = "../slide_core" }
doc_ffi = { path = "../../../../doc_common/crates/doc_ffi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
