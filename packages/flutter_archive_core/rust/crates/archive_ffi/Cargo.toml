[package]
name = "archive_ffi"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
description = "The Rust FFI layer of the archive engine, for dart:ffi."

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
archive_core = { path = "../archive_core" }
doc_ffi = { path = "../../../../doc_common/crates/doc_ffi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
doc_zip = { path = "../../../../doc_common/crates/doc_zip" }
